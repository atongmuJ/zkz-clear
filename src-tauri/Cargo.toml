[package]
name = "mole-win"
version = "1.2.0"
description = "A lightweight Windows cleaner"
authors = ["张开嘴清理"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "mole_win_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
