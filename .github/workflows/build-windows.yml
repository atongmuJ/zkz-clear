name: build-windows

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "构建完成后创建 Release（推 tag 触发时无需勾选，会自动发布）"
        type: boolean
        default: false
      release_tag:
        description: "Release tag（仅 publish=true 时填写，如 v1.2.0；留空则用配置版本）"
        type: string
        required: false
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 版本号来源：显式 release_tag > 推 tag 时的 tag 名 > tauri.conf.json
      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ref = "${{ github.ref }}"
          $releaseTag = "${{ github.event.inputs.release_tag }}"

          if ($releaseTag -match '^v\d+\.\d+\.\d+') {
            $ver = $releaseTag.Substring(1)
            $src = "release tag $releaseTag"
          } elseif ($ref -like "refs/tags/v*") {
            $ver = $ref.Substring("refs/tags/v".Length)
            $src = "tag $ref"
          } else {
            $conf = Get-Content "src-tauri/tauri.conf.json" -Raw -Encoding utf8 | ConvertFrom-Json
            $ver = $conf.version
            $src = "src-tauri/tauri.conf.json"
          }

          if ($ver -notmatch '^\d+\.\d+\.\d+') {
            throw "版本号无法解析：'$ver'（来源：$src）。tag 应形如 v0.1.1"
          }

          "APP_VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "version=$ver"   | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "source=$src"    | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "版本号 $ver（来源：$src）"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      # 一次构建同时产出：release 单文件 exe + NSIS 安装包。
      # 用 --config 覆盖版本号，避免仓库里的 tauri.conf.json 落后于 tag，
      # 导致 exe 内嵌版本、安装包文件名与实际发布版本不一致。
      - name: Build app and installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          @{ version = $env:APP_VERSION } | ConvertTo-Json -Compress |
            Set-Content -Path "$env:RUNNER_TEMP/version-override.json" -Encoding utf8
          npm run tauri build -- --config "$env:RUNNER_TEMP/version-override.json"
          if ($LASTEXITCODE -ne 0) { throw "构建失败（退出码 $LASTEXITCODE）" }

      - name: Collect and verify artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # 不同 Tauri 版本对产物命名处理略有差异，这里按优先级兜底查找
          $candidates = @(
            "src-tauri/target/release/ZhangZuiCleaner.exe",
            "src-tauri/target/release/mole-win.exe",
            "src-tauri/target/release/张开嘴清理.exe"
          )
          $exe = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $exe) {
            $fallback = Get-ChildItem "src-tauri/target/release" -Filter *.exe -File -ErrorAction SilentlyContinue |
                        Sort-Object Length -Descending | Select-Object -First 1
            if ($fallback) { $exe = $fallback.FullName }
          }
          if (-not $exe -or -not (Test-Path $exe)) {
            throw "构建失败：target/release 下没有找到可执行文件"
          }

          $setup = Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter *.exe -ErrorAction SilentlyContinue |
                   Sort-Object Length -Descending | Select-Object -First 1
          if (-not $setup) { throw "构建失败：未生成 NSIS 安装包" }

          # 产物版本必须与本次构建的版本号一致，否则说明 --config 覆盖没生效
          if ($setup.Name -notlike "*$env:APP_VERSION*") {
            throw "安装包文件名 '$($setup.Name)' 不含版本号 $env:APP_VERSION，版本覆盖可能未生效"
          }

          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item $setup.FullName "out/ZhangZuiCleaner-Setup-$env:APP_VERSION-x64.exe"

          # 免安装版 zip：解压即用，内含重命名后的 exe 与专用说明。
          # 只发布「安装包 + 免安装 zip」两个文件，不再附单文件 exe，避免用户选错。
          $greenDir = Join-Path $env:RUNNER_TEMP "green"
          New-Item -ItemType Directory -Force -Path $greenDir | Out-Null
          Copy-Item $exe (Join-Path $greenDir "张开嘴清理.exe")
          Copy-Item "portable/GREEN-README.txt" (Join-Path $greenDir "使用说明.txt")
          $zip = "out/ZhangZuiCleaner-Green-$env:APP_VERSION-x64.zip"
          Compress-Archive -Path "$greenDir/*" -DestinationPath $zip -Force
          if (-not (Test-Path $zip)) { throw "免安装版 zip 打包失败" }

          $files = Get-ChildItem out -File
          if ($files.Count -ne 2) { throw "产物数量应为 2（安装包 + 免安装 zip），实际 $($files.Count)" }
          $files | ForEach-Object {
            "{0}  ({1:N1} MB)" -f $_.Name, ($_.Length / 1MB)
          }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZhangZuiCleaner-windows-x64-${{ steps.ver.outputs.version }}
          path: out/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish release
        # 推 v* tag 时自动发布；手动运行工作流则需显式勾选 publish。
        if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ format('v{0}', steps.ver.outputs.version) }}
          name: 张开嘴清理 v${{ steps.ver.outputs.version }}
          body: |
            Windows x64 正式版。下面**两个文件选一个下载即可**，功能完全一致，只是安装方式不同：

            | 文件 | 安装方式 | 适合谁 |
            | --- | --- | --- |
            | `ZhangZuiCleaner-Setup-${{ steps.ver.outputs.version }}-x64.exe` | **安装版**：双击安装，自动建桌面/开始菜单快捷方式，缺 WebView2 会自动补 | 想长期固定在这台电脑上用 |
            | `ZhangZuiCleaner-Green-${{ steps.ver.outputs.version }}-x64.zip` | **免安装版**：解压到文件夹，双击里面的「张开嘴清理.exe」即用；删掉文件夹即卸载 | 想免安装、拷 U 盘、换电脑用 |

            两者数据各自独立，不用都装。

            **使用步骤**

            1. 安装版：双击 `Setup-...exe` → 一路下一步 → 桌面出现「张开嘴清理」图标，双击打开。
            2. 免安装版：右键 zip →「全部解压缩」→ 进入解压出的文件夹 → 双击「张开嘴清理.exe」。
            3. 首次打开若出现蓝色「Windows 已保护你的电脑」：点「更多信息」→「仍要运行」（程序未做代码签名，属正常提示）。
            4. 点白色大按钮「扫描电脑」→ 看列表 → 点「清理选中项」。

            系统要求：Windows 10 1803+ / Windows 11（64 位）。

            「C 盘清理」中的休眠文件、系统还原点、Windows.old 等项目需要右键「以管理员身份运行」。

            版本来源：${{ steps.ver.outputs.source }} · 提交 ${{ github.sha }}
          files: out/*
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
